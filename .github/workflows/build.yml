name: Build plugin

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build plugin
        run: npm run build
      - name: Verify installation package
        run: |
          unzip -t package.zip
          unzip -p package.zip plugin.json | node -e '
            let text = "";
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const manifest = JSON.parse(text);
              if (manifest.name !== "siyuan-copilot-codex") process.exit(1);
            });
          '
          unzip -l package.zip | grep 'mcp/siyuan-mcp/index.cjs'
          sha256sum package.zip > package.zip.sha256
      - name: Upload installation package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siyuan-copilot-codex-${{ github.sha }}
          path: |
            package.zip
            package.zip.sha256
          if-no-files-found: error
          retention-days: 30
